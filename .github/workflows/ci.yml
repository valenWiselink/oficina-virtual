# CI for the office: the same checks and builds that run before `npm run dist:win`.
# Releases are built and published locally, so there is no release workflow.

name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # Nothing here launches Electron; electron-builder runs only on the release PC.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Validate AsyncAPI spec
        run: npm run asyncapi:validate

      - name: Generated messages are up to date
        run: |
          npm run asyncapi:generate
          if ! git diff --exit-code core/src/messages.ts; then
            echo "::error::core/src/messages.ts is out of sync with core/asyncapi.yaml. Run 'npm run asyncapi:generate' and commit the result."
            exit 1
          fi

      - name: Type check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Webview tests
        run: npm run test:webview

      - name: Build app
        run: npm run build:app

      - name: Build desktop
        run: npm run build:desktop

      # After the build: these tests run dist/cli.js and dist/hooks/claude-hook.js.
      # Every home variable points at a throwaway folder so no test can reach a
      # real ~/.pixel-agents or ~/.claude.
      - name: Server tests
        run: |
          mkdir -p "$TEST_HOME"
          npm run test:server
        env:
          TEST_HOME: ${{ runner.temp }}/test-home
          HOME: ${{ runner.temp }}/test-home
          USERPROFILE: ${{ runner.temp }}/test-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/test-home/.config
