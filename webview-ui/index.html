<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48.png?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=4" />
    <!-- viewport-fit=cover: draw under the iPhone notch/home bar (safe-area
         insets pad the card bar back out). user-scalable=no: pinch belongs to
         the office canvas zoom, not page zoom. interactive-widget: Android
         resizes the layout when the keyboard opens, so xterm re-fits. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content"
    />
    <!-- The standalone page URL carries the server token (?token=); never send it as a Referer. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f8f3ed" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS "Add to Home Screen": standalone chrome-less launch -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Oficina" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <!-- public/ also holds favicon.ico, apple-touch-icon.png and
         apple-touch-icon-precomposed.png at their conventional paths: browsers
         and iOS probe those without a <link>, and the standalone server's SPA
         fallback would otherwise answer the probe with index.html, leaving a
         stale cached icon in place forever. Bump ?v= on every icon change. -->
    <!-- UI font (falls back to the system sans when offline). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
    <title>Oficina</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
